onboarding = false

[theme]
name = "catppuccin"

auto_switch = false
[terminal]
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "alt+s"

reload_config = "prefix+shift+r"
detach = "prefix+shift+q"
settings = "prefix+shift+s"
workspace_picker = "prefix+p"
goto = "prefix+s"
new_workspace = "prefix+n"
new_worktree = "prefix+shift+g"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+alt+d"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = ["alt+shift+h", "prefix+shift+left"]
next_workspace = ["alt+shift+l", "prefix+shift+right"]
previous_agent = ["alt+k", "prefix+alt+k"]
next_agent = ["alt+j", "prefix+alt+j"]
focus_agent = "prefix+alt+1..9"

new_tab = ["cmd+t", "prefix+c", "ctrl+alt+c"]
rename_tab = "prefix+shift+t"
previous_tab = ["alt+h", "ctrl+alt+["]
next_tab = ["alt+l", "ctrl+alt+]"]
switch_tab = "prefix+1..9"
close_tab = ["cmd+w", "prefix+shift+x"]

rename_pane = "prefix+shift+p"
copy_mode = "prefix+v"
focus_pane_left = "cmd+h"
focus_pane_down = ["cmd+j", "prefix+j"]
focus_pane_up = ["cmd+k", "prefix+k"]
focus_pane_right = ["cmd+l", "prefix+l"]
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+backtick"
split_vertical = ["prefix+slash", "ctrl+alt+d"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d"]
close_pane = "prefix+q"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
navigate_pane_right = "l"

[[keys.command]]
key = "ctrl+shift+h"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --current --direction left'
description = "resize pane left"

[[keys.command]]
key = "ctrl+shift+j"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --current --direction down'
description = "resize pane down"

[[keys.command]]
key = "ctrl+shift+k"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --current --direction up'
description = "resize pane up"

[[keys.command]]
key = "ctrl+shift+l"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --current --direction right'
description = "resize pane right"

[[keys.command]]
key = "prefix+h"
type = "popup"
command = "hunk diff --theme catppuccin-mocha"
description = "open hunk diff"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "lazydocker"
description = "open lazydocker"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = 'exec "${SHELL:-sh}"'
description = "open scratch terminal"
width = "80%"
height = "80%"

[ui]
sidebar_width = 30
sidebar_min_width = 18
sidebar_max_width = 40
mobile_width_threshold = 64
mouse_capture = true
redraw_on_focus_gained = true
mouse_scroll_lines = 3
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
agent_panel_sort = "priority"
accent = "cyan"

status_indicators = "symbols"
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true

[ui.sound.agents]
droid = "on"

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
allow_nested = false
kitty_graphics = false
pane_history = true

[advanced]
scrollback_limit_bytes = 10000000
